<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FBF">
<meta name="apple-mobile-web-app-title" content="Engels">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<title>Engels Oefenapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: één kolom-app met vaste tabbalk onderaan (duimbereik op iPad/telefoon); kaarten in een raster. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EAEFF5; --fg:#1F2433; --muted:#5D6678; --line:#D7DEE8;
  --red:#1F5FBF; --red-soft:#E2ECFB; --gold:#F2A900; --ok:#2A9D6F; --ok-soft:#DDF3EA; --bad:#C8463D; --bad-soft:#FBE4E1;
  --t1:#E63946; --t2:#E07A1F; --t3:#1F9A8B; --t4:#2F6FA8; --t0:#8892A6;
  --display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hanzi:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --shadow:0 1px 2px rgba(31,36,51,.06),0 4px 14px rgba(31,36,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141821; --surface:#1D2330; --surface2:#262E3D; --fg:#EEF1F6; --muted:#A3ADBF; --line:#323B4D;
  --red:#6EA8FF; --red-soft:#1E2A40; --gold:#FFC23D; --ok:#4CC995; --ok-soft:#1E3A30; --bad:#FF7A6E; --bad-soft:#3D2522;
  --t1:#FF6B74; --t2:#FFA552; --t3:#45C9B8; --t4:#6FA8E0; --t0:#8E98AC; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141821; --surface:#1D2330; --surface2:#262E3D; --fg:#EEF1F6; --muted:#A3ADBF; --line:#323B4D;
  --red:#6EA8FF; --red-soft:#1E2A40; --gold:#FFC23D; --ok:#4CC995; --ok-soft:#1E3A30; --bad:#FF7A6E; --bad-soft:#3D2522;
  --t1:#FF6B74; --t2:#FFA552; --t3:#45C9B8; --t4:#6FA8E0; --t0:#8E98AC; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--hanzi);font-size:26px;font-weight:700;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:.9rem}
/* schrijven */
.charstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.charstrip button{font-family:var(--hanzi);font-size:1.5rem;min-width:52px;min-height:52px;padding:4px;position:relative;flex:none}
.charstrip button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.charstrip button .tick{position:absolute;right:3px;top:1px;font-family:var(--body);font-size:.65rem;color:var(--ok)}
.charstrip button[aria-pressed="true"] .tick{color:#fff}
.boardwrap{display:grid;grid-template-columns:var(--bs) minmax(0,1fr);gap:18px;align-items:start}
.boardwrap > div{min-width:0}
@media (max-width:700px){.boardwrap{grid-template-columns:minmax(0,1fr)}}
.board{position:relative;width:var(--bs);height:var(--bs);border-radius:16px;overflow:hidden;background:var(--surface);border:2px solid var(--red);touch-action:none;margin:0 auto}
.board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board canvas{touch-action:none;cursor:crosshair}
.feedback{min-height:28px;font-weight:800;margin-top:8px;text-align:center}
.feedback.good{color:var(--ok)}.feedback.bad{color:var(--bad)}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.steps svg{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cinfo .hz{font-size:3.2rem;line-height:1}
h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:44px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.8rem;font-weight:700;color:var(--muted)}
.hz{font-family:var(--hanzi);font-weight:500}
.py{font-weight:800;letter-spacing:.01em}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.muted{color:var(--muted)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;color:var(--muted);border-radius:12px}
nav.tabs button .ic{font-family:var(--hanzi);font-size:1.3rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--red);background:var(--red-soft)}
/* lesson list */
.book{margin-bottom:8px}
.book > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:1.05rem}
.book > summary::-webkit-details-marker{display:none}
.book[open] > summary{border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.bookno{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:.95rem;flex:none}
.lessons{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));padding:8px 0 4px}
.lesson{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
.lesson .dot{width:10px;align-self:stretch;border-radius:6px;flex:none}
.lesson .info{min-width:0;flex:1}
.lesson .nm{font-weight:800;font-size:.92rem;line-height:1.2}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:6px}
/* word list */
.words{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.word{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.word .hz{font-size:1.7rem;line-height:1.1;min-width:2.2em}
.word .meta{min-width:0}
.word .nl{font-size:.88rem}
.word .box{margin-left:auto;font-size:.7rem;font-weight:800;color:var(--muted)}
.spk{margin-left:auto;font-size:1.1rem;padding:6px 10px;min-height:38px}
/* flashcard */
.flash{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;user-select:none;position:relative}
.flash .big{font-size:clamp(3.6rem,14vw,6.5rem);line-height:1.05}
.flash .nlbig{font-family:var(--display);font-size:2rem;font-weight:600}
.flash .hint{color:var(--muted);font-size:.85rem}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;font-size:.9rem;color:var(--muted)}
.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{min-height:74px;font-size:1.05rem}
.opt.hzopt{font-family:var(--hanzi);font-size:2rem;font-weight:500}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.tonebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tonebtns button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.tonebtns svg{width:56px;height:36px}
.score{font-family:var(--display);font-size:1.4rem;font-weight:700}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--red-soft);border:1px solid var(--red);font-size:.92rem}
.notice b{display:block}
.ok-note{background:var(--ok-soft);border-color:var(--ok)}
/* taal */
.langsw{margin-left:auto;flex:none}
.langsw button{min-height:34px;padding:4px 10px;font-weight:800;font-size:.85rem}
/* route */
.unit{color:#fff;border-radius:16px;padding:12px 16px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display)}
.unit span{font-size:.85rem;opacity:.9}
.node-row{display:flex;justify-content:center;margin:6px 0}
.node{position:relative;background:none;border:0;box-shadow:none;padding:0;min-height:0;border-radius:50%}
.node svg{display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.node.sel svg{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 6px var(--gold))}
.node .bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--fg);font-weight:800;font-size:.75rem;padding:3px 10px;border-radius:10px;white-space:nowrap;font-family:var(--display)}
.node.cur{margin-top:28px}
.wdetail{margin:8px 0 14px}
.auto{padding:6px 0}
.bookline{padding:4px 0;font-size:.92rem}
.auto .bar{margin-top:6px}
button.small{min-height:34px;padding:4px 12px;font-size:.85rem}
.week{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.week.done{opacity:.6}
.wk{font-family:var(--display);font-weight:700;font-size:1.05rem;width:58px;text-align:center;border-radius:12px;padding:6px 0;color:#fff;height:fit-content}
.task{display:flex;gap:10px;align-items:flex-start;padding:4px 0;cursor:pointer}
.task input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ok)}
.task.b4 span{color:var(--t4);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat .n{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.82rem;font-weight:700}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:38px;padding:6px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
label.inline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
input[type=range]{accent-color:var(--red)}
@media (max-width:520px){.opts{grid-template-columns:1fr}.answer-row{grid-template-columns:1fr 1fr}h1{font-size:1.35rem}}
@media (prefers-reduced-motion:no-preference){.flash{transition:transform .25s}.flash:active{transform:scale(.98)}}

/* engels-specifiek */
.en{font-family:var(--display);font-weight:600}
.word .en{font-size:1.25rem;line-height:1.15}
.flash .big{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1.1;overflow-wrap:anywhere}
.lvl{display:flex;align-items:center;gap:10px}
.lvl .badge{min-width:44px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;padding:0 8px}
.soon{opacity:.55}
.spellin{width:100%;font-size:1.6rem;font-family:var(--display);text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.spellin:focus{outline:none;border-color:var(--red)}
.diff{font-family:var(--display);font-size:1.7rem;letter-spacing:.04em}
.diff .ok{color:var(--ok)} .diff .no{color:var(--bad);text-decoration:underline}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:8px;border-radius:14px}
.tiles.answer{border:2px dashed var(--line);background:var(--surface2)}
.tile{font-family:var(--display);font-size:1.15rem;font-weight:600;min-height:46px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.badpos{border-color:var(--bad);background:var(--bad-soft)}
.tile:disabled{opacity:1;color:var(--fg)}
.tiles.solved .tile{border-color:var(--ok);background:var(--ok-soft)}
.sentence{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;margin-bottom:6px}
.fbbtn{min-height:34px;padding:4px 12px;font-weight:800;font-size:.85rem;border-radius:12px;flex:none}
.fbov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.fbbox{width:100%;max-width:520px;max-height:90vh;overflow:auto}
.fbbox .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
/* mascotte */
.mascot{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;animation:m-in .55s cubic-bezier(.2,1.4,.4,1) both}
.mascot.out{animation:m-out .35s ease-in both}
.m-body{width:112px;height:122px;pointer-events:auto;cursor:pointer;margin-right:4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.m-body svg{width:100%;height:100%;overflow:visible}
.m-bubble{position:relative;pointer-events:auto;background:#fff;color:#1F2433;border:3px solid #1F2433;border-radius:28px;padding:10px 16px;margin-bottom:22px;margin-right:34px;max-width:min(260px,70vw);text-align:center;font-family:var(--display);box-shadow:0 6px 16px rgba(0,0,0,.15);min-height:0;display:block}
.m-bubble b{display:block;font-size:1.25rem;line-height:1.15}
.m-bubble .m-py{display:block;font-size:.85rem;color:#5D6678;font-family:var(--body);font-weight:700}
.m-bubble .m-tr{display:block;font-size:.9rem;font-weight:600;margin-top:2px}
.m-bubble .m-streak{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:800;background:#FFF1C9;color:#8A5A00;border-radius:999px;padding:2px 10px}
.m-dot1,.m-dot2{position:absolute;background:#fff;border:3px solid #1F2433;border-radius:50%}
.m-dot1{width:18px;height:18px;right:18px;bottom:-20px}
.m-dot2{width:10px;height:10px;right:6px;bottom:-34px}
.mascot.big .m-bubble,.mascot.mega .m-bubble{border-color:#F2A900;background:#FFFBEA}
.mascot.oops .m-bubble{border-color:#2F6FA8}
.m-eyes{animation:m-blink 3.2s infinite;transform-origin:60px 46px}
.m-arm-r{animation:m-wave .9s ease-in-out 3;transform-origin:84px 98px}
.mascot.oops .m-arm-r{animation:none}
.m-tail{animation:m-tail 1.2s ease-in-out infinite;transform-origin:84px 104px}
@keyframes m-in{0%{transform:translateY(160px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes m-out{to{transform:translateY(160px) scale(.7);opacity:0}}
@keyframes m-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes m-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes m-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.mascot.mega .m-body{animation:m-jump .6s ease-in-out 3}
@keyframes m-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion: reduce){.mascot,.mascot.out,.m-eyes,.m-arm-r,.m-tail,.mascot.mega .m-body{animation:none}}
</style>
</head>
<body>

};

/* ---------- taal ---------- */
const LANG = (() => { if (SETTINGS.lang) return SETTINGS.lang; const n = (navigator.language || 'nl').toLowerCase(); SETTINGS.lang = n.startsWith('pl') ? 'pl' : 'nl'; store.set('set', SETTINGS); return SETTINGS.lang; })();
try{ document.documentElement.lang = LANG; }catch(e){}
const mean = w => LANG === 'pl' ? w.pl : w.nl;
const ltitle = L => L.t[LANG] || L.t.nl;
function trText(s){
  const d = I18N[LANG]; if (!d) return null;
  if (d[s] !== undefined) return d[s];
  const nums = []; const key = s.replace(/\d+/g, m => { nums.push(m); return '{n}'; });
  if (!nums.length || d[key] === undefined) return null;
  let i = 0; return d[key].replace(/\{n\}/g, () => nums[i++] ?? '');
}
const T = s => trText(s) ?? s;
const TRATTR = ['placeholder', 'aria-label', 'title', 'label'];
function trNode(n){
  if (LANG === 'nl') return;
  if (n.nodeType === 3){
    const v = n.nodeValue, t = v.trim(); if (!t || !/[A-Za-zÀ-ž]/.test(t)) return;
    if (n.parentNode && n.parentNode.closest && n.parentNode.closest('.notr')) return;
    const r = trText(t); if (r !== null && r !== t) n.nodeValue = v.slice(0, v.indexOf(t)) + r + v.slice(v.indexOf(t) + t.length);
    else if (r === null && window.I18NMISS) I18NMISS.add(t);
    return;
  }
  if (n.nodeType !== 1 || n.tagName === 'SCRIPT' || n.tagName === 'STYLE') return;
  if (n.classList && n.classList.contains('notr')) return;
  TRATTR.forEach(a => { if (n.hasAttribute && n.hasAttribute(a)){ const v = n.getAttribute(a), r = trText(v.trim()); if (r !== null && r !== v) n.setAttribute(a, r); } });
  n.childNodes.forEach(trNode);
}
function startI18n(){
  if (LANG === 'nl') return;
  trNode(document.body);
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === 'characterData' || m.type === 'attributes') trNode(m.target); else m.addedNodes.forEach(trNode);
  })).observe(document.body, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TRATTR});
}

/* ---------- data ---------- */
const ALL = [], SENTS = [], LESSONS = [];
LEVELS.forEach(V => V.l.forEach(L => {
  LESSONS.push(L); L.lv = V.id;
  L.words = L.w.map((w, i) => { const o = {id: L.k + '-' + i, en: w[0], nl: w[1], pl: w[2], e: w[3] || '', k: L.k, lv: V.id, c: L.c}; ALL.push(o); return o; });
  L.sents = L.s.map((s, i) => { const o = {id: L.k + '-s' + i, en: s[0], nl: s[1], pl: s[2], k: L.k}; SENTS.push(o); return o; });
}));
const LBYK = Object.fromEntries(LESSONS.map(L => [L.k, L]));
const today = () => Math.floor(Date.now() / 86400000);
const INTERVALS = [0, 1, 3, 7, 14, 30];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- spraak ---------- */
let VOICE = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices(), want = SETTINGS.accent === 'us' ? /en[-_]US/i : /en[-_]GB/i;
  const pool = vs.filter(v => want.test(v.lang)), any = vs.filter(v => /^en/i.test(v.lang));
  VOICE = pool.find(v => /premium/i.test(v.name)) || pool.find(v => /enhanced|verbeterd/i.test(v.name)) || pool.find(v => /daniel|serena|kate|samantha|alex|ava|arthur|martha/i.test(v.name)) || pool[0] || any[0] || null;
  renderVoiceNote(); return VOICE;
}
function speak(text, rate){
  if (!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = SETTINGS.accent === 'us' ? 'en-US' : 'en-GB'; if (VOICE) u.voice = VOICE;
    u.rate = rate || SETTINGS.rate || 0.9;
    if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 120); }
    else speechSynthesis.speak(u);
  }catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function renderVoiceNote(){
  const el = document.getElementById('voiceNote'); if (!el) return;
  if (!('speechSynthesis' in window)) el.innerHTML = `<div class="notice"><span>🔇</span><div><b>Deze browser kan niet voorlezen.</b>Open de app in Safari op je iPad of iPhone.</div></div>`;
  else if (!VOICE) el.innerHTML = `<div class="notice"><span>🔊</span><div><b>Geen Engelse stem gevonden (nog).</b>Op je iPad/iPhone: Instellingen → Toegankelijkheid → Gesproken materiaal → Stemmen → Engels → download een stem, bijv. "Daniel" of "Serena". Herlaad daarna deze pagina. Werkt het geluid al? Dan kun je dit negeren.</div></div>`;
  else el.innerHTML = '';
}
function voiceControls(){
  const r = SETTINGS.rate || 0.9;
  return `<div class="seg" role="group" aria-label="Accent"><button data-acc="gb" aria-pressed="${SETTINGS.accent !== 'us'}">🇬🇧 Brits</button><button data-acc="us" aria-pressed="${SETTINGS.accent === 'us'}">🇺🇸 Amerikaans</button></div>
    <label class="inline">🐢 Spreektempo <input id="rate" type="range" min="0.6" max="1.1" step="0.1" value="${r}"> <span id="rateV">${r.toFixed(1)}×</span></label>`;
}
function bindVoice(){
  view.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => { SETTINGS.accent = b.dataset.acc; store.set('set', SETTINGS); pickVoice(); speak('Hello, how are you?'); render(); }));
  const r = document.getElementById('rate'); if (!r) return;
  r.addEventListener('input', () => { SETTINGS.rate = +r.value; document.getElementById('rateV').textContent = SETTINGS.rate.toFixed(1) + '×'; store.set('set', SETTINGS); });
  r.addEventListener('change', () => speak('Hello'));
}

/* ---------- SRS + dagen ---------- */
function mark(id, good){
  const s = SRS[id] || {b: 0, d: today()};
  if (good){ s.b = Math.min(5, s.b + 1); s.d = today() + INTERVALS[s.b]; } else { s.b = 0; s.d = today(); }
  s.m = Math.max(s.m || 0, s.b); s.t = Date.now();
  SRS[id] = s; store.set('srs', SRS); logDay(); scheduleSync();
}
function markSent(id){ SENT[id] = {t: Date.now()}; store.set('sent', SENT); logDay(); scheduleSync(); }
function logDay(){ const t = today(); if (DAYS[DAYS.length - 1] !== t){ DAYS.push(t); DAYS = DAYS.slice(-400); store.set('days', DAYS); } }
function streak(){ const set = new Set(DAYS); let t = today(); if (!set.has(t)) t--; let n = 0; while (set.has(t)){ n++; t--; } return n; }
const bestBox = id => { const s = SRS[id]; return s ? Math.max(s.m || 0, s.b) : 0; };
function lessonProg(L){
  const wp = L.words.length ? L.words.reduce((a, w) => a + Math.min(bestBox(w.id), 3) / 3, 0) / L.words.length : 0;
  const sp = L.sents.length ? L.sents.filter(s => SENT[s.id]).length / L.sents.length : 0;
  return L.sents.length ? wp * 0.7 + sp * 0.3 : wp;
}

/* ---------- les kiezen ---------- */
function scopeWords(scope){
  if (scope === 'due') return ALL.filter(w => SRS[w.id] && SRS[w.id].d <= today());
  if (scope === 'pics') return ALL.filter(w => w.e);
  if (LEVELS.some(V => V.id === scope)) return ALL.filter(w => w.lv === scope);
  return (LBYK[scope] || {words: []}).words;
}
function scopeSents(scope){
  if (LEVELS.some(V => V.id === scope)) return SENTS.filter(s => LBYK[s.k].lv === scope);
  return (LBYK[scope] || {sents: []}).sents;
}
function scopeSelect(id, val, extra){
  let h = `<select id="${id}" aria-label="Kies les">`;
  if (extra) h += `<option value="due" ${val==='due'?'selected':''}>⏰ Te herhalen vandaag (${ALL.filter(w=>SRS[w.id]&&SRS[w.id].d<=today()).length})</option><option value="pics" ${val==='pics'?'selected':''}>🖼 Woorden met plaatjes (${ALL.filter(w=>w.e).length})</option>`;
  LEVELS.forEach(V => { if (!V.l.length) return;
    h += `<optgroup label="${T('Niveau')} ${V.id}"><option value="${V.id}" ${val===V.id?'selected':''}>${T('Alles uit')} ${V.id}</option>`;
    V.l.forEach((L, i) => { h += `<option value="${L.k}" ${val===L.k?'selected':''}>${V.id} · ${T('Les')} ${i + 1} · ${esc(ltitle(L))}</option>`; });
    h += `</optgroup>`; });
  return h + `</select>`;
}
function bindScope(id, key, reset){
  const sel = document.getElementById(id); if (!sel) return;
  sel.addEventListener('change', () => { SETTINGS[key] = sel.value; store.set('set', SETTINGS); reset(); render(); });
}

function renderLesson(){

/* ---------- flashcards ---------- */
let FL = null;
function buildDeck(scope, mode, level){
  let ws = scopeWords(scope); if (mode === 'pic') ws = ws.filter(w => w.e);
  const due = shuffle(ws.filter(w => SRS[w.id] && SRS[w.id].d <= today())), fresh = ws.filter(w => !SRS[w.id]), rest = ws.filter(w => SRS[w.id] && SRS[w.id].d > today());
  let deck;
  if (level === 'begin'){ const nw = fresh.slice(0, 5), dw = due.slice(0, 10); deck = nw.map(w => ({w, learn: true})).concat(shuffle(nw.concat(dw)).map(w => ({w}))); }
  else deck = due.concat(fresh.slice(0, 20)).slice(0, 30).map(w => ({w}));
  if (!deck.length) deck = shuffle(rest).slice(0, level === 'begin' ? 10 : 20).map(w => ({w}));
  return {deck, i: 0, flipped: false, good: 0, bad: 0, scope, mode, level, hint: false};
}

  const bindCtl = () => { bindVoice(); bindScope('scope', 'scope', () => FL = null);

  view.innerHTML = h; bindCtl();

  document.getElementById('say').addEventListener('click', () => speak(w.en));
  document.getElementById('slow').addEventListener('click', () => speak(w.en, 0.6));
  const hb = document.getElementById('hintb'); if (hb) hb.addEventListener('click', () => { FL.hint = true; render(); });

    document.getElementById('no').addEventListener('click', () => { mark(w.id, false); cheer(false); FL.bad++; FL.deck.push({w}); nx(); });
  }
}

/* ---------- spelling ---------- */
const norm = s => s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.!?,]/g, '').replace(/\s+/g, ' ').trim().replace(/^to /, '');
function diffHTML(target, typed){
  let out = ''; const a = target, b = typed.toLowerCase();
  for (let i = 0; i < a.length; i++){ const ok = b[i] !== undefined && b[i] === a[i].toLowerCase(); out += `<span class="${ok ? 'ok' : 'no'}">${esc(a[i] === ' ' ? ' ' : a[i])}</span>`; }
  return out;
}
let SP = null;
function buildSpell(scope){
  const ws = scopeWords(scope).filter(w => /^[A-Za-z' -]+$/.test(w.en));
  const due = ws.filter(w => SRS[w.id] && SRS[w.id].d <= today()), weak = ws.filter(w => bestBox(w.id) < 3 && !due.includes(w));
  let list = shuffle(due).concat(weak).slice(0, 10); if (list.length < 10) list = list.concat(shuffle(ws.filter(w => !list.includes(w)))).slice(0, 10);
  return {scope, list, i: 0, tries: 0, hint: 0, state: 'ask', typed: '', good: 0};
}
function spellBox(w, st, onDone){
  // gedeeld door Spelling-tab en quiz-etappe 4
  let h = `<div class="card flash" style="min-height:220px;cursor:default">${w.e ? `<div style="font-size:3rem">${w.e}</div>` : ''}<div class="nlbig notr">${esc(mean(w))}</div>
    <div class="row" style="justify-content:center"><button id="spsay" class="primary">🔊 Luister</button><button id="spslow">🐢 Langzaam</button></div></div>
    <div style="margin-top:12px"><input id="spin" class="spellin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Typ het Engelse woord" value="${esc(st.typed)}" ${st.state !== 'ask' ? 'disabled' : ''}></div>`;
  if (st.state === 'ask'){
    h += `<div class="row" style="margin-top:10px;justify-content:center"><button class="primary" id="spcheck">Controleer</button><button id="sphint">💡 Hint: volgende letter</button></div>`;
    if (st.tries) h += `<div class="feedback bad">Bijna! Kijk naar de rode letters en probeer opnieuw.</div><div class="diff notr" style="text-align:center">${diffHTML(w.en, st.last || '')}</div>`;
  } else {
    h += `<div class="feedback ${st.state === 'good' ? 'good' : 'bad'}">${st.state === 'good' ? 'Goed gespeld! 👍' : 'Zo schrijf je het:'}</div><div class="diff notr" style="text-align:center"><span class="ok">${esc(w.en)}</span></div>
      <div style="margin-top:12px;text-align:center"><button class="primary" id="spnext">Volgende →</button></div>`;
  }
  return h;
}
function bindSpellBox(w, st, rerender, finish){
  const inp = document.getElementById('spin');
  document.getElementById('spsay').addEventListener('click', () => speak(w.en));
  document.getElementById('spslow').addEventListener('click', () => speak(w.en, 0.6));
  if (!st.spoke){ st.spoke = true; setTimeout(() => speak(w.en), 250); }
  if (st.state === 'ask'){
    setTimeout(() => { try{ inp.focus(); }catch(e){} }, 50);
    inp.addEventListener('input', () => { st.typed = inp.value; });
    const check = () => {
      st.typed = inp.value; if (!st.typed.trim()) return;
      if (norm(st.typed) === norm(w.en)){ st.state = 'good'; mark(w.id, st.hint === 0 && st.tries === 0); if (st.hint === 0 && st.tries === 0) cheer(true); speak(w.en); }
      else { st.tries++; st.last = st.typed; if (st.tries >= 3){ st.state = 'bad'; mark(w.id, false); cheer(false); speak(w.en); } }
      rerender();
    };
    document.getElementById('spcheck').addEventListener('click', check);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
    document.getElementById('sphint').addEventListener('click', () => {
      let n = 0; const t = st.typed.toLowerCase(); while (n < w.en.length && t[n] === w.en[n].toLowerCase()) n++;
      st.typed = w.en.slice(0, n + 1); st.hint++; rerender();
    });
  } else document.getElementById('spnext').addEventListener('click', finish);
}
function renderSpell(){
  const scope = SETTINGS.sscope || 'A1-1';
  if (!SP || SP.scope !== scope) SP = buildSpell(scope);
  let h = `<h2>Spelling</h2><div class="card"><div class="row">${scopeSelect('sscope', scope, false)}</div><div class="row" style="margin-top:10px">${voiceControls()}</div>
    <p class="muted" style="margin:.5em 0 0;font-size:.85rem">Luister naar het woord en typ het in het Engels. Je ziet de betekenis als hulp. Hoofdletters maken niet uit.</p></div>`;
  const bindCtl = () => { bindVoice(); bindScope('sscope', 'sscope', () => SP = null); };
  if (!SP.list.length){ view.innerHTML = h + `<p class="muted">Geen woorden in deze les.</p>`; bindCtl(); return; }
  if (SP.i >= SP.list.length){
    view.innerHTML = h + `<div class="card" style="margin-top:12px;text-align:center"><p class="score">Klaar! ${SP.good} / ${SP.list.length} in één keer goed</p><button class="primary" id="spagain">Volgende ronde</button></div>`;
    bindCtl(); document.getElementById('spagain').addEventListener('click', () => { SP = buildSpell(scope); render(); }); return;
  }
  const w = SP.list[SP.i];
  h += `<div class="prog"><span>Woord ${SP.i + 1} van ${SP.list.length}</span><span>✅ ${SP.good}</span></div>` + spellBox(w, SP);
  view.innerHTML = h; bindCtl();
  bindSpellBox(w, SP, render, () => { if (SP.state === 'good' && SP.tries === 0 && SP.hint === 0) SP.good++; Object.assign(SP, {i: SP.i + 1, tries: 0, hint: 0, state: 'ask', typed: '', last: '', spoke: false}); render(); });
}

/* ---------- zinnen bouwen ---------- */
const PROPER = new Set(['I']);
SENTS.forEach(s => s.en.split(' ').slice(1).forEach(t => { const c = t.replace(/[^A-Za-z']/g, ''); if (/^[A-Z]/.test(c)) PROPER.add(c); }));
function tokens(en){
  const m = en.match(/^(.*?)([.?!]*)$/); const words = m[1].split(' ');
  const first = words[0].replace(/[^A-Za-z']/g, '');
  if (!PROPER.has(first) && !/^I'/.test(first)) words[0] = words[0][0].toLowerCase() + words[0].slice(1);
  return {words, end: m[2]};
}
let ZN = null;
function buildZin(scope){
  const ss = scopeSents(scope);
  const list = ss.filter(s => !SENT[s.id]).concat(shuffle(ss.filter(s => SENT[s.id]))).slice(0, 8);
  return {scope, list, i: 0};
}
function setupZin(){ const s = ZN.list[ZN.i], tk = tokens(s.en); let pool = shuffle(tk.words.map((t, i) => ({t, i}))); if (pool.length > 1 && pool.every((p, k) => p.i === k)) pool = pool.reverse(); Object.assign(ZN, {tk, pool, ans: [], state: 'ask', bad: -1, hints: 0, errs: 0}); }
function renderZin(){
  const scope = SETTINGS.zscope || 'A1-1';
  if (!ZN || ZN.scope !== scope){ ZN = buildZin(scope); if (ZN.list.length) setupZin(); }
  let h = `<h2>Zinnen bouwen</h2><div class="card"><div class="row">${scopeSelect('zscope', scope, false)}</div><div class="row" style="margin-top:10px">${voiceControls()}</div>
    <p class="muted" style="margin:.5em 0 0;font-size:.85rem">Tik de Engelse woorden in de goede volgorde. Tik op een woord in je zin om het terug te zetten.</p></div>`;
  const bindCtl = () => { bindVoice(); bindScope('zscope', 'zscope', () => ZN = null); };
  if (!ZN.list.length){ view.innerHTML = h + `<p class="muted">Geen zinnen in deze les.</p>`; bindCtl(); return; }
  if (ZN.i >= ZN.list.length){
    view.innerHTML = h + `<div class="card" style="margin-top:12px;text-align:center"><p class="score">Klaar! 🎉 Alle zinnen van deze ronde gebouwd.</p><button class="primary" id="zagain">Volgende ronde</button></div>`;
    bindCtl(); document.getElementById('zagain').addEventListener('click', () => { ZN = buildZin(scope); if (ZN.list.length) setupZin(); render(); }); return;
  }
  const s = ZN.list[ZN.i], solved = ZN.state === 'good';
  h += `<div class="prog"><span>Zin ${ZN.i + 1} van ${ZN.list.length}</span><span>${SENT[s.id] ? '✓' : ''}</span></div>
    <div class="card" style="text-align:center"><div class="nlbig notr" style="font-family:var(--display);font-size:1.35rem;font-weight:600">${esc(mean(s))}</div>
    <div class="tiles answer ${solved ? 'solved' : ''}" id="ans">${ZN.ans.map((p, k) => `<button class="tile notr ${k === ZN.bad ? 'badpos' : ''}" data-a="${k}" ${solved ? 'disabled' : ''}>${esc(p.t)}</button>`).join('')}${ZN.ans.length === ZN.tk.words.length ? `<span class="tile notr" style="border:0;box-shadow:none;background:none">${esc(ZN.tk.end)}</span>` : ''}</div>
    <div class="tiles" id="pool">${ZN.pool.map((p, k) => `<button class="tile notr ${ZN.ans.includes(p) ? 'used' : ''}" data-p="${k}" ${solved ? 'disabled' : ''}>${esc(p.t)}</button>`).join('')}</div>
    ${ZN.state === 'wrong' ? `<div class="feedback bad">Nog niet helemaal. Het rode woord staat niet goed.</div>` : ''}
    ${solved ? `<div class="feedback good">Goed zo! 🎉</div><div class="en notr" style="font-size:1.2rem">${esc(s.en)}</div>` : ''}
    <div class="row" style="justify-content:center;margin-top:10px">${solved ? `<button id="zsay">🔊 Luister</button><button class="primary" id="znext">Volgende →</button>` : `<button id="zhint">💡 Hint</button><button id="zlisten">🔊 Luister naar de zin</button><button id="zreset">↺ Opnieuw</button>`}</div></div>`;
  view.innerHTML = h; bindCtl();
  const done = () => {
    if (ZN.ans.length !== ZN.tk.words.length) return;
    const bad = ZN.ans.findIndex((p, k) => p.t !== ZN.tk.words[k]);

  });

  if (g('zreset')) g('zreset').addEventListener('click', () => { ZN.ans = []; ZN.state = 'ask'; ZN.bad = -1; render(); });
  if (g('zsay')) g('zsay').addEventListener('click', () => speak(s.en));
  if (g('znext')) g('znext').addEventListener('click', () => { ZN.i++; if (ZN.i < ZN.list.length) setupZin(); render(); });
}

/* ---------- quiz ---------- */
let QZ = null;
const PATH = ['meaning', 'ear', 'reverse', 'spell'];
const PATHNAME = {meaning: 'Wat betekent het?', ear: 'Wat hoor je?', reverse: 'Hoe zeg je het in het Engels?', spell: 'Schrijf het woord'};
const QMODES = {meaning: 'EN → betekenis', ear: '👂 Hoor → woord', reverse: 'Betekenis → EN', spell: '✍️ Typ het woord'};
function newQuiz(scope, kind, mode){
  const pool = []; const seen = new Set(); scopeWords(scope).forEach(w => { if (!seen.has(w.en)){ seen.add(w.en); pool.push(w); } });
  if (kind === 'path'){
    const prev = QZ && QZ.scope === scope && QZ.set ? QZ.set.map(w => w.id) : [];
    let set = pool.filter(w => bestBox(w.id) < 3 && !prev.includes(w.id)).slice(0, 5);
    if (set.length < 4) set = shuffle(pool).slice(0, 5);
    return {kind, scope, set, pool, stage: 0, qs: shuffle(set), i: 0, score: 0, picked: null, stageScore: []};
  }
  return {kind, scope, mode, pool, qs: shuffle(pool).slice(0, 10), i: 0, score: 0, picked: null};
}
function renderQuiz(){
  const scope = SETTINGS.scope && !['due', 'pics'].includes(SETTINGS.scope) ? SETTINGS.scope : 'A1-1';
  const kind = SETTINGS.qkind || 'path', fmode = SETTINGS.qmode || 'meaning';
  if (!QZ || QZ.scope !== scope || QZ.kind !== kind || (kind === 'free' && QZ.mode !== fmode)) QZ = newQuiz(scope, kind, fmode);
  const mode = kind === 'path' ? PATH[QZ.stage] : fmode;
  let h = `<h2>Quiz</h2><div class="card"><div class="row">${scopeSelect('qscope', scope, false)}
    <div class="seg" role="group" aria-label="Soort quiz"><button data-qk="path" aria-pressed="${kind==='path'}">🪜 Stap voor stap</button><button data-qk="free" aria-pressed="${kind==='free'}">🎲 Vrije quiz</button></div></div>
    ${kind === 'free' ? `<div class="seg" role="group" aria-label="Vraagsoort" style="margin-top:10px">${Object.entries(QMODES).map(([k, v]) => `<button data-q="${k}" aria-pressed="${fmode===k}">${v}</button>`).join('')}</div>`
      : `<p class="muted" style="margin:.6em 0 0;font-size:.88rem">Stap voor stap: je oefent steeds dezelfde 5 woorden in 4 etappes, van makkelijk naar moeilijk. Daarna volgen de volgende 5 woorden.</p>`}
    <div class="row" style="margin-top:10px">${voiceControls()}</div></div>`;
  const bindCtl = () => { bindVoice(); bindScope('qscope', 'scope', () => QZ = null);

let ROUTESEL = null;

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${done ? 'var(--gold)' : col}" stroke-width="7" stroke-linecap="round" opacity="${p > 0.005 ? 1 : 0}" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r - 8}" fill="${done ? 'var(--gold)' : p > 0 ? col : 'var(--surface2)'}"/>
    <text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="${size * .26}" fill="${p > 0 || done ? '#fff' : 'var(--muted)'}">${done ? '✓' : label}</text></svg>`;

/* ---------- voortgang samenvoegen / overzetten ---------- */
function mergeData(d){
  let ch = false; const srs = d.srs || {};
  Object.keys(srs).forEach(id => {
    const r = srs[id], l = SRS[id]; if (!r || typeof r.b !== 'number') return;
    if (!l){ SRS[id] = r; ch = true; return; }
    const rt = r.t || 0, lt = l.t || 0, win = rt > lt ? r : lt > rt ? l : (Math.max(r.m || 0, r.b) > Math.max(l.m || 0, l.b) ? r : l), m = Math.max(r.m || 0, r.b, l.m || 0, l.b);
    if (win !== l || (l.m || 0) !== m){ SRS[id] = Object.assign({}, win, {m}); ch = true; }
  });
  const sn = d.sent || {}; Object.keys(sn).forEach(id => { if (!SENT[id]){ SENT[id] = sn[id]; ch = true; } });
  const before = DAYS.length; DAYS = [...new Set([...DAYS, ...(Array.isArray(d.days) ? d.days : [])])].sort((x, y) => x - y).slice(-400); if (DAYS.length !== before) ch = true;
  store.set('srs', SRS); store.set('sent', SENT); store.set('days', DAYS);
  return ch;
}
const payload = () => JSON.stringify({v: 1, updated: new Date().toISOString(), srs: SRS, sent: SENT, days: DAYS});
function transferCard(){
  return `<details class="card" id="xfer" style="margin-top:24px"><summary style="font-weight:800;cursor:pointer">🔄 Voortgang overzetten</summary>
    <p class="muted" style="font-size:.88rem">Gebruik je de app op twee plekken zonder synchroniseren? Kopieer hier je voortgang en plak hem op de andere plek bij Leerroute → Voortgang overzetten.</p>
    <div class="row"><button class="primary" id="xcopy">📋 Kopieer mijn voortgang</button></div>
    <textarea id="xcode" rows="3" style="width:100%;margin-top:10px;font-size:.8rem;border-radius:10px;border:1px solid var(--line);padding:8px;background:var(--surface2);color:var(--fg)" placeholder="Plak hier de code van de andere plek"></textarea>
    <div class="row" style="margin-top:8px"><button id="ximport">⬇️ Zet voortgang over</button><span id="xmsg" class="muted" style="font-size:.88rem"></span></div></details>`;
}
function bindTransfer(){
  const msg = document.getElementById('xmsg'), ta = document.getElementById('xcode');
  document.getElementById('xcopy').addEventListener('click', async () => {
    const c = 'ENG1:' + btoa(unescape(encodeURIComponent(payload()))); ta.value = c;
    try{ await navigator.clipboard.writeText(c); msg.textContent = '✓ Gekopieerd! Plak hem in de app op de andere plek.'; }catch(e){ ta.select(); msg.textContent = 'Kopiëren lukte niet vanzelf: houd je vinger op de code in het vak → Kopieer.'; }
  });
  document.getElementById('ximport').addEventListener('click', () => {
    try{ const c = ta.value.trim(); if (!c.startsWith('ENG1:')) throw 0; const d = JSON.parse(decodeURIComponent(escape(atob(c.slice(5))))); mergeData(d); msg.textContent = `✓ Gelukt! ${Object.keys(d.srs || {}).length} woorden overgezet.`; setTimeout(() => { const sy = window.scrollY; render(); window.scrollTo(0, sy); }, 900); }
    catch(e){ msg.textContent = 'Deze code klopt niet. Kopieer hem opnieuw op de andere plek.'; }
  });
}

/* ---------- synchroniseren via privé GitHub Gist ---------- */
const SYNCFILE = 'engels-voortgang.json';
const SYNCHERE = location.protocol === 'https:' && /github\.io$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let SYNC = store.get('sync', null), SYNCBUSY = false, SYNCTIMER = null, SYNCSTATE = SYNC && SYNC.last ? 'ok' : '';
function otherAppToken(){ try{ const m = JSON.parse(localStorage.getItem('mdr-sync') || 'null'); return m && m.token || null; }catch(e){ return null; } }
async function gh(path, opt = {}){
  const headers = {'Authorization': 'Bearer ' + SYNC.token, 'Accept': 'application/vnd.github+json'}; if (opt.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, Object.assign({}, opt, {headers, cache: 'no-store'}));
  if (!r.ok){ const e = new Error('http ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function findGist(){
  for (let page = 1; page <= 5; page++){ const list = await gh('/gists?per_page=100&page=' + page); const g = list.find(x => x.files && x.files[SYNCFILE]); if (g) return g.id; if (list.length < 100) break; }
  return (await gh('/gists', {method: 'POST', body: JSON.stringify({description: 'Engels Oefenapp – voortgang (niet verwijderen)', public: false, files: {[SYNCFILE]: {content: payload()}}})})).id;
}
function syncStatusText(){
  const t = SYNC && SYNC.last ? new Date(SYNC.last).toLocaleTimeString(LANG === 'pl' ? 'pl-PL' : 'nl-NL', {hour: '2-digit', minute: '2-digit'}) : '';
  return ({busy: '🔄 Bezig met synchroniseren…', ok: `✅ Gesynchroniseerd (${t})`, offline: '📴 Geen internet. Je voortgang wordt bijgewerkt zodra je weer online bent.', badtoken: '⚠️ De sleutel werkt niet (meer). Ontkoppel en maak een nieuwe sleutel aan.', err: '⚠️ Synchroniseren lukte even niet. De app probeert het straks opnieuw.'})[SYNCSTATE] || '';
}
function setSync(st){ SYNCSTATE = st; const el = document.getElementById('syncStatus'); if (el) el.textContent = syncStatusText(); }
async function syncNow(){
  if (!SYNCHERE || !SYNC || !SYNC.token || SYNCBUSY) return false;
  if (navigator.onLine === false){ setSync('offline'); return false; }
  SYNCBUSY = true; setSync('busy'); let ch = false;
  try{
    if (!SYNC.gist){ SYNC.gist = await findGist(); store.set('sync', SYNC); }
    const g = await gh('/gists/' + SYNC.gist), f = g.files && g.files[SYNCFILE];
    if (f){ let txt = f.content; if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url, {cache: 'no-store'})).text(); try{ ch = mergeData(JSON.parse(txt)); }catch(e){} }
    await gh('/gists/' + SYNC.gist, {method: 'PATCH', body: JSON.stringify({files: {[SYNCFILE]: {content: payload()}}})});
    SYNC.last = Date.now(); store.set('sync', SYNC); SYNCBUSY = false; setSync('ok');
    if (ch && (TAB === 'route' || TAB === 'leren')){ const sy = window.scrollY; render(); window.scrollTo(0, sy); }

}

const CHEER = {ok: 0, bad: 0, last: 0};
function cheer(good){
  if (good){ CHEER.ok++; CHEER.bad = 0; if (CHEER.ok % 5 === 0) showMascot(CHEER.ok >= 20 ? 'mega' : CHEER.ok >= 10 ? 'big' : 'five', CHEER.ok); }
  else { CHEER.bad++; CHEER.ok = 0; if (CHEER.bad >= 3){ CHEER.bad = 0; showMascot('oops', 0); } }
}
function showMascot(kind, n){
  const list = MASCOT_MSG[kind]; if (!list) return;
  const m = list[Math.floor(Math.random() * list.length)];
  const old = document.getElementById('mascot'); if (old) old.remove();
  const el = document.createElement('div'); el.id = 'mascot'; el.className = 'mascot ' + kind; el.setAttribute('role', 'status');
  const streakTxt = n ? ({nl: `${n} op rij! 🔥`, en: `${n} in a row! 🔥`, pl: `${n} z rzędu! 🔥`})[LANG] : '';
  el.innerHTML = `<button class="m-bubble notr" type="button" aria-label="🔊">${MASCOT_BUBBLE(m)}${streakTxt ? `<span class="m-streak">${streakTxt}</span>` : ''}<i class="m-dot1"></i><i class="m-dot2"></i></button>
    <div class="m-body">${MASCOT_SVG[MASCOT_KIND]}</div>`;
  document.body.appendChild(el);
  el.querySelector('.m-bubble').addEventListener('click', e => { e.stopPropagation(); speak(MASCOT_SAY(m)); });
  el.querySelector('.m-body').addEventListener('click', () => hide());
  let t = setTimeout(hide, kind === 'five' || kind === 'oops' ? 3600 : 4600);
  function hide(){ clearTimeout(t); el.classList.add('out'); setTimeout(() => el.remove(), 400); }
}
/* ---- feedback ---- */
function fbContext(){
  const dev = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document ? 'iPad' : /iPhone/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'computer';
  const scope = SETTINGS.scope || '';
  return `${APPNAME} · tab: ${TAB}${LESSON ? ' · les ' + LESSON : scope ? ' · ' + scope : ''} · ${LANG.toUpperCase()} · ${dev}`;
}
function openFeedback(){
  if (document.getElementById('fbov')) return;
  const ov = document.createElement('div'); ov.id = 'fbov'; ov.className = 'fbov';
  ov.innerHTML = `<div class="card fbbox" role="dialog" aria-modal="true" aria-label="Feedback">
    <div class="row" style="justify-content:space-between"><b style="font-family:var(--display);font-size:1.15rem">💬 Feedback geven</b><button class="ghost" id="fbclose" aria-label="Sluiten">✕</button></div>
    <p class="muted" style="font-size:.9rem;margin:6px 0 10px">Wat vind je van de app? Wat is makkelijk, wat is onduidelijk en wat mis je? Je bericht gaat via WhatsApp, Berichten of mail naar degene die je de app stuurde.</p>
    <div class="seg" role="group" aria-label="Hoe vind je de app?" id="fbrate"><button data-r="😍">😍 Super</button><button data-r="👍">👍 Goed</button><button data-r="😐">😐 Gaat wel</button><button data-r="👎">👎 Niet goed</button></div>
    <textarea id="fbtxt" rows="5" style="font-family:inherit;width:100%;margin-top:10px;font-size:1rem;border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--surface2);color:var(--fg)" placeholder="Typ hier je feedback…"></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="fbsend">📤 Versturen</button><span id="fbmsg" class="muted" style="font-size:.88rem"></span></div></div>`;
  document.body.appendChild(ov);
  let rate = '';
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('#fbclose').addEventListener('click', close);
  ov.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { rate = b.dataset.r; ov.querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  setTimeout(() => { try{ ov.querySelector('#fbtxt').focus(); }catch(e){} }, 50);
  ov.querySelector('#fbsend').addEventListener('click', async () => {
    const txt = ov.querySelector('#fbtxt').value.trim(), msg = ov.querySelector('#fbmsg');
    if (!txt && !rate){ msg.textContent = 'Kies een smiley of typ eerst iets.'; return; }
    const body = `💬 Feedback ${APPNAME}\n${rate ? rate + '\n' : ''}${txt}\n\n(${fbContext()})`;
    if (navigator.share){ try{ await navigator.share({text: body}); close(); return; }catch(e){ if (e && e.name === 'AbortError') return; } }
    try{ await navigator.clipboard.writeText(body); msg.textContent = '✓ Gekopieerd! Plak het in WhatsApp of een mail en stuur het op.'; }
    catch(e){ ov.querySelector('#fbtxt').value = body; ov.querySelector('#fbtxt').select(); msg.textContent = 'Kopieer de tekst in het vak en stuur hem op.'; }
  });
}
(function(){ const sw = document.getElementById('langsw'); if (!sw) return; const b = document.createElement('button'); b.className = 'fbbtn'; b.type = 'button'; b.innerHTML = '💬 <span>Feedback</span>'; b.addEventListener('click', openFeedback); sw.parentNode.insertBefore(b, sw.nextSibling); })();
